<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Audio-based image distortion experiments by Markus Sanders.">
  <meta name="theme-color" content="#050505">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ABID Experiment I">
  <meta property="og:image" content="https://live.staticflickr.com/65535/50122786971_cf5f00d10a_k.jpg">
  <meta property="og:description" content="Audio-based Image Distortion Experiment #1">
  <meta property="og:url" content="https://markussanders.github.io/ABID-Experiment/">
  <title>ABID Experiment I</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="experience" aria-label="Audio-based image distortion canvas">
    <div class="overlay overlay-hidden" aria-live="polite">
      <div class="control">
        <span class="prompt">Sound on</span>
        <span class="prompt">Arrow keys change image</span>
        <span class="prompt">Space toggles audio</span>
      </div>
      <div class="counter">
        <span id="count">1 / 8</span>
        <span id="title"></span>
      </div>
    </div>

    <div class="controls-bar controls-visible" aria-label="Playback controls">
      <button class="control-button" type="button" data-action="previous" aria-label="Previous piece">Prev</button>
      <button class="control-button control-button-primary" type="button" data-action="toggle" aria-label="Play or pause audio">Play</button>
      <button class="control-button" type="button" data-action="next" aria-label="Next piece">Next</button>
    </div>

    <div class="loader-screen" role="status" aria-live="polite">
      <h1 class="loader" aria-label="Loading">
        <span>L</span>
        <span>O</span>
        <span>A</span>
        <span>D</span>
        <span>I</span>
        <span>N</span>
        <span>G</span>
      </h1>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
  <script src="helpers.js"></script>
</body>

</html>
